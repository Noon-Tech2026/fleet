# Pile de production — isolee de Supabase (reseau + noms dedies)
services:
  mysql:
    image: mysql:8.4
    container_name: fleet-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?definir DB_ROOT_PASSWORD dans .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - fleet-mysqldata:/var/lib/mysql
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: fleet-phpmyadmin
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8083:80"
    networks:
      - fleet-net

  traccar:
    image: traccar/traccar:latest
    container_name: fleet-traccar
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"
      - "5027:5027/tcp"
      - "5027:5027/udp"
      - "5055:5055"
    volumes:
      - ./infra/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - fleet-traccar-logs:/opt/traccar/logs
    networks:
      - fleet-net

  api:
    build:
      context: ./backend
    container_name: fleet-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: fleet
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: fleet
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET dans .env}
      TELEMETRY_SOURCE: ${TELEMETRY_SOURCE:-simulator}
      TRACCAR_URL: http://traccar:8082
      TRACCAR_USER: ${TRACCAR_USER:-admin@example.com}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:-changeme}
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - fleet-net

networks:
  fleet-net:
    driver: bridge
    name: fleet-net

volumes:
  fleet-mysqldata:
  fleet-traccar-logs:
